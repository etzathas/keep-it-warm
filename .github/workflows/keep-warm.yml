name: Keep Render App Warm

on:
  schedule:
    # Runs every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allows manual trigger from the Actions tab

env:
  RENDER_URL: https://cineorama.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          echo "Pinging $RENDER_URL"
          curl -sS --max-time 20 -o /dev/null -w "HTTP status: %{http_code}\n" "$RENDER_URL" \
            && echo "Ping succeeded" \
            || echo "Ping failed (app may still be waking up)"
